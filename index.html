<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>vr</title>
</head>
<body>

    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clicable">
      
        <!--declaro los objetos dentro del codigo-->
        <a-assets>
            <a-asset-item id="mercado" src="modelos/mercado.glb"></a-asset-item>
            <a-asset-item id="tree-a" src="modelos/arbol1.glb" ></a-asset-item>
            <a-asset-item id="tree-b" src="modelos/arbol2.glb" ></a-asset-item>
            <a-asset-item id="interior" src="modelos/interior.glb" ></a-asset-item>
            <a-asset-item id="door" src="modelos/puerta.glb" ></a-asset-item>
            <a-asset-item id="door-up" src="modelos/puerta_arriba.glb" ></a-asset-item>
            <a-asset-item id="piso" src="modelos/piso.glb" ></a-asset-item>
            <img src="fondo.jpg" id="cielo">
            <audio id="ave" src="audio/sonido_ave.mp3"></audio>
            <audio id="aveb" src="audio/ave2.wav"></audio>
            <audio id="int" src="audio/mercado.mp3"></audio>
            <audio id="soundoor" src="audio/puerta.wav"></audio>
        <!--<audio id="campana" src="audio/campana.mp3"></audio>-->
        </a-assets>


        <a-sky src="#cielo"></a-sky>

        <!--hago aparecer los modelos-->

        <a-entity 
            gltf-model="#tree-a" 
            position="-30 0 -5"
            scale="3 3 3"
            sound="src: #ave; 
            autoplay: true; 
            loop: true; 
            positional: true; 
            refDistance: 0.5; 
            rolloffFactor: 1;
            maxDistance: 15;
            distanceModel: linear">
        </a-entity>

         <a-entity 
            gltf-model="#tree-a" 
            position="-30 0 -5"
            scale="3 3 3"
            rotation="0 45 0">
        </a-entity>

         <a-entity 
            gltf-model="#tree-a" 
            position="-30 0 -5"
            scale="2 2 2"
            rotation="0 -45 0">
        </a-entity>

        <a-entity 
            gltf-model="#tree-b" 
            position="19.5 -0.5 -5"
            sound="src: #aveb; 
            autoplay: true; 
            loop: true; 
            positional: true; 
            refDistance: 0.5; 
            maxDistance: 5;
            rolloffFactor: 1;
            distanceModel: linear">
        </a-entity>
         
        <a-entity 
            gltf-model="#tree-b"
            scale="1.5 1.5 1.5" 
            position="20 -0.5 -5"
            rotation="0 -45 0">
        </a-entity>



        <a-entity 
            gltf-model="#mercado" 
            position="0 0 -35">
        </a-entity>

        <a-entity 
            gltf-model="#interior" 
            position="0 0 -35"
            scale="1 1 1"
            sound="src: #int; autoplay: true; loop: true; positional: true; refDistance: 1; 
            maxDistance: 30;
            distanceModel: linear">
        </a-entity>

        <a-entity
            gltf-model="#door" 
            position="-1 0.2 -6"
            class="clickable"
            sound="src: #soundoor; on: click; poolSize: 3"
            animation="property: rotation; to: 0 90 0; dur: 5000; easing: easeOutQuad; startEvents: click">
        </a-entity>

        <a-entity
            gltf-model="#door" 
            position="0 0.2 -6"
            >
        </a-entity>

        <a-entity
            gltf-model="#door-up" 
            position="-1 0.2 -6">
        </a-entity>

        <a-entity
            gltf-model="#door-up" 
            position="1 0.2 -6"
            rotation="0 180 0"
            class="clickable"
            sound="src: #soundoor; on: click; poolSize: 3"
            animation="property: rotation; to: 0 90 0; dur: 5000; easing: easeOutQuad; startEvents: click">
        </a-entity>

        <a-entity
            gltf-model="#piso"
            position="0 0 -35"
            rotation="0 0 0">
            
        </a-entity>



        
        
        <a-entity camera="fav:60" look-controls wasd-controls position="0 1.6 0">
        <a-cursor color="yellow"></a-cursor>
        </a-entity>

        <a-light type="ambient" color="#ffffff" intensity="3"></a-light>
        <a-light type="directional" color="#ffffff" intensity="1.5" position="1 4 2"></a-light>
        
    </a-scene>
    



</body>
</html>
